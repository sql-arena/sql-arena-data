[project]
name = "sql-arena-data"
version = "0.1.0"
description = "Generate the SQL Arena datasets and publish them to s3://sql-arena"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3",
    "duckdb>=1.4",
    "pyarrow",
    "pyiceberg[pyarrow,sql-sqlite]>=0.9",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "sqlglot>=30.21.0",
]
